name: Framework compatibility

permissions:
  contents: read

on:
  push:
    branches: [main] # Only run on main branch
  pull_request:
    branches: ['*'] # Run on all branches

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - framework: angular
            consumer: 20
          - framework: angular
            consumer: 21
          - framework: angular
            consumer: 22
          - framework: react
            consumer: 18
          - framework: react
            consumer: 19
          - framework: vue
            consumer: 3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build packages
        run: npm run build
      - name: Verify ${{ matrix.framework }} ${{ matrix.consumer }} compatibility
        run: node scripts/verify-framework-compat.js ${{ matrix.framework }} ${{ matrix.consumer }}
