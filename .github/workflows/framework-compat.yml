name: Framework compatibility

permissions:
  contents: read

on:
  push:
    branches: [main] # Only run on main branch
  pull_request:
    branches: ['*'] # Run on all branches

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build packages
        run: npm run build
      - name: Pack tarballs
        run: |
          mkdir -p tarballs
          npm pack ./packages/stencil-library --pack-destination tarballs
          npm pack ./packages/react-library --pack-destination tarballs
          npm pack ./packages/vue-library --pack-destination tarballs
          npm pack ./packages/angular-library --pack-destination tarballs
      - uses: actions/upload-artifact@v7
        with:
          name: compat-tarballs
          path: tarballs
          retention-days: 1

  verify:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - framework: angular
            consumer: 20
          - framework: angular
            consumer: 21
          - framework: angular
            consumer: 22
          - framework: react
            consumer: 18
          - framework: react
            consumer: 19
          - framework: vue
            consumer: 3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          name: compat-tarballs
          path: tarballs
      - name: Verify ${{ matrix.framework }} ${{ matrix.consumer }} compatibility
        run: node scripts/verify-framework-compat.js ${{ matrix.framework }} ${{ matrix.consumer }}
        env:
          PREBUILT_TARBALLS: tarballs
